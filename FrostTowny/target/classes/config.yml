# ===========================================
# FrostTowny Configuration v1.0.0
# 🔥 Premium Bukkit/Nukkit Plugins! Custom development available. Contact @maizeslava8 on Discord!
# ===========================================

# General
general:
  command-cooldown: 2
  debug-mode: false

# Town creation
town-creation:
  cost: 1000.0
  min-town-distance: 5
  new-town-protection: 24

# Economy
economy:
  chunk-claim-cost: 50.0
  chunk-unclaim-refund: 0.25
  chunk-tax: 10.0
  max-deposit: 10000.0
  max-withdrawal: 10000.0
  mayor-salary: 50.0
  deputy-salary: 25.0
  assistant-salary: 10.0

# Limits
limits:
  max-residents: 20
  max-chunks: 50
  max-description-length: 100
  max-plots-per-resident: 3
  max-deputies: 3
  max-assistants: 5

# Chunks
chunks:
  require-adjacency: true
  max-claim-radius: 10
  allow-unclaim-home: false
  auto-unclaim-on-bankruptcy: true

# War
war:
  war-declaration-cost: 500.0
  min-war-duration: 2
  max-war-duration: 168
  auto-peace-after-duration: true
  allow-pvp-in-enemy-territory: true
  allow-block-break-in-enemy-territory: false
  allow-block-place-in-enemy-territory: false

# Town flags
flags:
  chest-access: false
  door-access: false
  pvp: false
  pvp-same-town: false
  mob-spawning: true
  explosions: false
  item-frames: false
  armor-stands: false

# Inactivity
inactivity:
  auto-kick-inactive-residents: true
  resident-inactivity-days: 14
  town-inactivity-days: 30
  auto-disband-days: 60

# Visual
visual:
  show-entry-title: true
  show-entry-chat: true

# Notifications
notifications:
  notify-tax-collection: true
  notify-town-events: true