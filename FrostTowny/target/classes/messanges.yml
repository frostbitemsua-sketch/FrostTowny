# Command messages
command:
  only-ingame: "&cThis command can only be used in-game!"
  unknown: "&cUnknown command!"
  usage-prefix: "&cUsage: {0}"
  town-not-found: "&cTown not found!"
  player-not-found: "&cPlayer not found!"
  invalid-number: "&cInvalid number!"
  cooldown: "&eWait {0} seconds!"
  no-permission: "&cNo permission!"

# Town creation
town:
