name: FrostTowny
main: frost.towny.FrostTowny
version: 1.0.0
api: ["1.0.13"]
author: FrostDEV
description: Advanced town management system for Nukkit - Order plugins in Discord @maizeslava8
depend: [EconomyAPI]
softdepend: [PlaceholderAPI]
commands:
  town:
    description: Town management commands
    usage: /town <command>
    aliases: ["t"]
permissions:
  frosttowny.use:
    description: Allow using FrostTowny commands
    default: true
  frosttowny.create:
    description: Create new towns
    default: true
  frosttowny.admin:
    description: Full admin access to FrostTowny
    default: op
    children:
      frosttowny.bypass.*: true
  frosttowny.bypass.build:
    description: Bypass building restrictions
    default: op
  frosttowny.bypass.chest:
    description: Bypass chest access restrictions
    default: op